version: 2

# Environment variables
env:
  - CGO_ENABLED=0
  - APP_NAME=psi-map

# Build settings
builds:
  - id: psi-map
    main: ./main.go
    binary: "{{ .Env.APP_NAME }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} # Embed version in binary

# Archive settings
archives:
  - name_template: "{{ .Env.APP_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    rlcp: true
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Checksum settings
checksum:
  name_template: "{{ .Env.APP_NAME }}_{{ .Version }}_checksums.txt"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 7
  format: "[`{{ .SHA }}`](https://github.com/mattjh1/{{ .Env.APP_NAME }}/commit/{{ .SHA }}): {{ .Message }} ({{ .AuthorUsername }})"

  filters:
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"
      - "^ci(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^refactor(\\(.*\\))?:"

# GitHub release settings
release:
  github:
    owner: mattjh1
    name: psi-map
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto

# Hooks for pre-release checks
before:
  hooks:
    - make ci-test
