services:
  # API Mode
  psi-map-api:
    build: 
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    entrypoint: ["/app/psi-map-api"]
    healthcheck:
      test: ["CMD", "/app/psi-map-api", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # CLI Mode (for one-off analysis)
  psi-map-cli:
    build: 
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    volumes:
      - ./output:/app/output
      - ./cache:/app/cache
    entrypoint: ["/app/psi-map"]
    # Override with: docker-compose run psi-map-cli analyze sitemap.xml
    command: ["--help"]
    profiles:
      - cli
